<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo-Clicker</title>
    <style>
        /* KLASYCZNE BARWY SON GOKU: POMARAŃCZ I GRANAT */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ff8c00; /* GŁÓWNY POMARAŃCZ - Deep Orange */
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .auth-container { 
            background-color: #000080; /* GŁÓWNY GRANAT - Navy Blue */
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 350px; 
            text-align: center; 
            border: 1px solid #ffffff; /* Białe obramowanie dla definicji kontenera */
        }
        h1 { margin-top: 0; color: #ffffff; }
        input, select, button { 
            width: 100%; 
            margin: 10px 0; 
            padding: 10px; 
            border-radius: 5px; 
            border: none; 
            box-sizing: border-box; 
        }
        input, select { 
            background-color: #0000cd; /* ŚREDNI BŁĘKIT DLA INPUTÓW - Medium Blue */
            color: white; 
            border: 1px solid #ffffff; /* Białe obramowanie dla kontrastu */
        }
        /* Przycisk używa Pomarańczowego jako akcentu, aby popować na granatowym tle */
        button { 
            background-color: #ffcc00; /* JASNY POMARAŃCZ/ŻÓŁĆ DLA PRZYCISKU - Dark Orange/Yellow Accent */
            color: #000000; /* Czarny tekst dla czytelności na jasnym tle */
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:hover { background-color: #ffaa00; /* Lekko ciemniejszy pomarańcz na hover */ }
        .toggle-link { color: #ffffff; cursor: pointer; font-size: 0.9em; text-decoration: underline; margin-top: 15px; display: inline-block; }
        .message { margin-top: 15px; font-weight: bold; font-size: 0.9em; }
        .success { color: #66ff66; /* Jasny zielony dla kontrastu na granatowym tle */ }
        .error { color: #ff6666; /* Jasny czerwony dla kontrastu na granatowym tle */ }
        #register-form { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Dojo-Clicker</h1>

        <div id="login-form">
            <h2>Logowanie</h2>
            <input type="email" id="login-email" placeholder="E-mail" required>
            <input type="password" id="login-password" placeholder="Hasło" required>
            <button onclick="login()">Zaloguj się</button>
            <div class="toggle-link" onclick="toggleForms()">Nie masz konta? Zarejestruj się</div>
        </div>

        <div id="register-form">
            <h2>Rejestracja</h2>
            <input type="email" id="reg-email" placeholder="E-mail" required>
            <input type="password" id="reg-password" placeholder="Hasło" required>
            <input type="text" id="reg-username" placeholder="Twoja nazwa (Nick)" required>
            <select id="reg-gender">
                <option value="M">Mężczyzna</option>
                <option value="K">Kobieta</option>
            </select>
            <button onclick="register()">Utwórz postać</button>
            <div class="toggle-link" onclick="toggleForms()">Masz już konto? Zaloguj się</div>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <script>
        // ADRES TWOJEGO SERWERA NA RENDER.COM
        const API_URL = 'https://dojo-clicker.onrender.com/api/auth';

        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            document.getElementById('message-box').innerText = '';
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
            }
        }

        function showMessage(text, isError) {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = isError ? 'message error' : 'message success';
        }

        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const username = document.getElementById('reg-username').value;
            const gender = document.getElementById('reg-gender').value;

            if(!email || !password || !username) return showMessage('Wypełnij wszystkie pola!', true);

            showMessage('Tworzenie postaci...', false);

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username, gender })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Sukces! Możesz się teraz zalogować.', false);
                    setTimeout(toggleForms, 2000);
                } else {
                    showMessage(data.message, true);
                }
            } catch (error) {
                showMessage('Błąd połączenia z serwerem.', true);
            }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if(!email || !password) return showMessage('Wypełnij wszystkie pola!', true);

            showMessage('Logowanie...', false);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Zalogowano! Ładowanie gry...', false);
                    localStorage.setItem('session_token', data.token);
                    
                    setTimeout(() => alert("TUTAJ ZA CHWILĘ ZROBIMY GŁÓWNY INTERFEJS GRY!"), 1000);
                } else {
                    showMessage(data.message, true);
                }
            } catch (error) {
                showMessage('Błąd połączenia z serwerem.', true);
            }
        }
    </script>
</body>
</html>
