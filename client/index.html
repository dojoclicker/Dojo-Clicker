<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo-Clicker</title>
    <style>
        /* DESIGN SYSTEM (Wytyczne dla Windsurfa) */
        :root {
            --goku-orange: #f97316;       /* Główny akcent */
            --goku-orange-dark: #ea580c;  /* Akcent na Hover */
            --goku-navy: #0f172a;         /* Głęboki granat tła */
            --card-bg: #1e293b;           /* Tło paneli/kart */
            --input-bg: #334155;          /* Tło pól tekstowych */
            --text-main: #f8fafc;         /* Główny jasny tekst */
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: radial-gradient(circle at center, #1e3a8a, var(--goku-navy)); 
            color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }

        .auth-container { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            width: 320px; 
            text-align: center;
            border-top: 5px solid var(--goku-orange); /* Klasyczny detal */
        }

        h1 { 
            color: var(--text-main); 
            margin-top: 0; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
        }
        
        h1 span { color: var(--goku-orange); } /* Dwukolorowy tytuł */

        input, select, button { 
            width: 100%; margin: 8px 0; padding: 12px; 
            border-radius: 6px; border: none; box-sizing: border-box; 
            outline: none; font-family: inherit;
        }

        input, select { 
            background: var(--input-bg); 
            color: white; 
            transition: 0.3s;
        }

        input:focus, select:focus { 
            box-shadow: 0 0 0 2px var(--goku-orange); 
        }

        button { 
            background: var(--goku-orange); 
            color: white; 
            font-weight: 700; 
            text-transform: uppercase;
            cursor: pointer; 
            transition: 0.2s; 
        }

        button:hover { 
            background: var(--goku-orange-dark); 
            transform: translateY(-2px); 
        }

        .toggle-link { 
            color: #94a3b8; 
            cursor: pointer; 
            font-size: 0.85em; 
            margin-top: 15px; 
            transition: 0.2s; 
        }

        .toggle-link:hover { color: var(--goku-orange); }

        .message { margin-top: 15px; font-weight: bold; font-size: 0.9em; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        
        #register-form { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Dojo<span>Clicker</span></h1>

        <div id="login-form">
            <input type="email" id="login-email" placeholder="E-mail" required>
            <input type="password" id="login-password" placeholder="Hasło" required>
            <button onclick="login()">Zaloguj się</button>
            <div class="toggle-link" onclick="toggleForms()">Nie masz konta? Zarejestruj się</div>
        </div>

        <div id="register-form">
            <input type="email" id="reg-email" placeholder="E-mail" required>
            <input type="password" id="reg-password" placeholder="Hasło" required>
            <input type="text" id="reg-username" placeholder="Twoja nazwa (Nick)" required>
            <select id="reg-gender">
                <option value="M">Mężczyzna</option>
                <option value="K">Kobieta</option>
            </select>
            <button onclick="register()">Utwórz postać</button>
            <div class="toggle-link" onclick="toggleForms()">Masz już konto? Zaloguj się</div>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <script>
        const API_URL = 'https://dojo-clicker.onrender.com/api/auth';

        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            document.getElementById('message-box').innerText = '';
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
            }
        }

        function showMessage(text, isError) {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = isError ? 'message error' : 'message success';
        }

        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const username = document.getElementById('reg-username').value;
            const gender = document.getElementById('reg-gender').value;

            if(!email || !password || !username) return showMessage('Wypełnij wszystkie pola!', true);

            showMessage('Tworzenie postaci...', false);

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username, gender })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Sukces! Możesz się teraz zalogować.', false);
                    setTimeout(toggleForms, 2000);
                } else {
                    showMessage(data.message, true);
                }
            } catch (error) {
                showMessage('Błąd połączenia z serwerem.', true);
            }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if(!email || !password) return showMessage('Wypełnij wszystkie pola!', true);

            showMessage('Logowanie...', false);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Zalogowano! Ładowanie gry...', false);
                    localStorage.setItem('session_token', data.token);
                    setTimeout(() => alert("TUTAJ ZA CHWILĘ ZROBIMY GŁÓWNY INTERFEJS GRY!"), 1000);
                } else {
                    showMessage(data.message, true);
                }
            } catch (error) {
                showMessage('Błąd połączenia z serwerem.', true);
            }
        }
    </script>
</body>
</html>
